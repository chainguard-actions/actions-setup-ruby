name: Test basic Ruby setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        with:
          ruby-version: '3.1'
        continue-on-error: true
      - name: Assert action ran (succeeded with cached Ruby or failed gracefully without tool cache)
        env:
          OUTCOME: ${{ steps.setup-ruby.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — Ruby was found in tool cache"
            echo "Ruby version:"
            ruby --version
            RUBY_VER=$(ruby --version)
            if ! echo "$RUBY_VER" | grep -q "^ruby 3\.1"; then
              echo "FAIL: expected ruby 3.1.x but got: $RUBY_VER"
              exit 1
            fi
            echo "PASS: ruby version matches 3.1"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Ruby 3.1 not in tool cache under act — expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
