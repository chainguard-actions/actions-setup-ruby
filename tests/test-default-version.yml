name: Test default Ruby version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-ruby
        uses: .
        continue-on-error: true
      - name: Assert action ran (succeeded with cached Ruby or failed gracefully without tool cache)
        env:
          OUTCOME: ${{ steps.setup-ruby.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — Ruby was found in tool cache"
            RUBY_VER=$(ruby -e "puts RUBY_VERSION")
            echo "actual ruby version: $RUBY_VER"
            MAJOR=$(echo "$RUBY_VER" | cut -d. -f1)
            MINOR=$(echo "$RUBY_VER" | cut -d. -f2)
            if [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 4 ]; }; then
              echo "FAIL: expected ruby >= 2.4 but got $RUBY_VER"
              exit 1
            fi
            echo "PASS: ruby version $RUBY_VER satisfies >= 2.4"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Ruby in tool cache under act — expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
